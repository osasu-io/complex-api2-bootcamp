<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Cast Info</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <h1>Movie Cast & Actor Bio</h1>

    <input type="text" id="movieInput" placeholder="Enter movie title">
    <button id="fetchBtn">Get Info</button>

    <div id="result">
        <h2 id="movieTitle"></h2>
        <h3>First Cast Member:</h3>
        <p id="actorName"></p>
        <img id="actorImage" src="" alt="" style="width: 200px;">
        <h3>Bio:</h3>
        <p id="actorBio"></p>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
